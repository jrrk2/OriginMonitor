# nginx in front of the OriginWatch phone view: https://origin.kimmitt.uk/  (no port number; TLS and the LAN-only rule are nginx's job)
# Install:  sudo cp contrib/nginx/origin-watch.conf /etc/nginx/sites-available/origin-watch
#           sudo ln -sf /etc/nginx/sites-available/origin-watch /etc/nginx/sites-enabled/origin-watch
#           sudo nginx -t && sudo systemctl reload nginx
# OriginWatch itself then listens on 127.0.0.1:8480 (plain HTTP, tools/watch_web.sh start). The certificate files come from tools/web_cert.sh.
# Renewals reload nginx with:  sudo -n systemctl reload nginx   (needs a sudoers line: jonathan ALL=(root) NOPASSWD: /usr/bin/systemctl reload nginx)

server {
    listen 80;
    server_name origin.kimmitt.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;                          # IPv4 only: the host has public IPv6 addresses and this page must not be reachable from the internet
    server_name origin.kimmitt.uk;

    ssl_certificate     /home/jonathan/.config/origin/web/fullchain.pem;
    ssl_certificate_key /home/jonathan/.config/origin/web/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Behind a proxy OriginWatch only sees 127.0.0.1, so the private-network rule has to live here.
    allow 127.0.0.1;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    deny  all;

    location / {
        proxy_pass         http://127.0.0.1:8480;
        proxy_set_header   Host $host;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
    }
}
