# nginx in front of the OriginWatch phone view: https://origin.kimmitt.uk/  (no port number; TLS and access control are nginx's job)
# Install:  sudo cp contrib/nginx/origin-watch.conf /etc/nginx/sites-available/origin-watch
#           sudo ln -sf /etc/nginx/sites-available/origin-watch /etc/nginx/sites-enabled/origin-watch
#           sudo nginx -t && sudo systemctl reload nginx        (and on a ufw host: sudo ufw allow 443/tcp)
# OriginWatch itself listens on 127.0.0.1:8480 (plain HTTP, tools/watch_web.sh start). The server certificate comes from tools/web_cert.sh
# (Let's Encrypt via acme.sh, Cloudflare DNS challenge, so port 80 is only a redirect and is not opened on the hub).
# Renewals reload nginx with:  sudo -n systemctl reload nginx   (needs a sudoers line: jonathan ALL=(root) NOPASSWD: /usr/bin/systemctl reload nginx)
#
# Reachable from the internet through the hub's IPv4 port forward and IPv6 pinhole (TCP 443 to this host; tools/origin_ddns.py keeps the A and
# AAAA records current), so:
#   from the home network (geo $origin_lan): open, as before;
#   from anywhere else: only with a client certificate from ~/.config/origin/web/clientca (tools/clientca.sh issues and revokes them);
#   otherwise 403 from nginx, before anything reaches OriginWatch (behind the proxy OriginWatch only ever sees 127.0.0.1).
geo $origin_lan {
    default                  0;
    127.0.0.1                1;
    ::1                      1;
    192.168.0.0/16           1;
    10.0.0.0/8               1;
    172.16.0.0/12            1;
    fdcb:9951:c8c9:d5b8::/64 1;   # home ULA prefix
    2a00:23c9:148f:cd01::/64 1;   # home global prefix (BT); if BT renumbers, home IPv6 clients just need a certificate
}

server {
    listen 80;
    server_name origin.kimmitt.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name origin.kimmitt.uk;
    ssl_certificate        /home/jonathan/.config/origin/web/fullchain.pem;
    ssl_certificate_key    /home/jonathan/.config/origin/web/key.pem;
    ssl_protocols          TLSv1.2 TLSv1.3;

    ssl_client_certificate /home/jonathan/.config/origin/web/clientca/ca.crt;
    ssl_crl                /home/jonathan/.config/origin/web/clientca/crl.pem;
    ssl_verify_client      optional;
    ssl_verify_depth       1;

    set $origin_ok $origin_lan;
    if ($ssl_client_verify = SUCCESS) { set $origin_ok 1; }
    if ($origin_ok = 0) { return 403; }

    location / {
        proxy_pass         http://127.0.0.1:8480;
        proxy_set_header   Host $host;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
    }
}

# Any other name or a bare IP on 443: close without answering.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}
